<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pankaj Ultra Store</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
overflow-x:hidden;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* PARTICLES */
#particles-js{
position:fixed;
width:100%;
height:100%;
z-index:-1;
}

/* HEADER */
header{
background:#000000aa;
padding:20px;
text-align:center;
font-size:28px;
color:#00ffd5;
box-shadow:0 0 20px #00ffd5;
}

/* GRID */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
padding:30px;
}

/* CARD */
.card{
background:#111111aa;
border-radius:20px;
padding:20px;
text-align:center;
box-shadow:0 0 25px #00ffd580;
transition:0.4s;
backdrop-filter:blur(10px);
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 40px #00ffd5;
}

button{
padding:12px 25px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00ffd5,#0066ff);
color:white;
cursor:pointer;
margin-top:10px;
}

/* LOADING */
#loader{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
color:#00ffd5;
font-size:25px;
text-align:center;
padding-top:200px;
z-index:999;
}

/* CHATBOT */
#chatbot{
position:fixed;
bottom:20px;
right:20px;
width:250px;
background:#111;
border-radius:15px;
padding:10px;
box-shadow:0 0 15px #00ffd5;
}

#chatbot input{
width:100%;
padding:8px;
border:none;
border-radius:10px;
}

#chatlog{
height:120px;
overflow:auto;
font-size:12px;
margin-bottom:5px;
}

</style>
</head>

<body>

<div id="particles-js"></div>

<header>
💀 PANKAJ ULTRA STORE 💀
</header>

<div class="container">

<!-- DARK TUNNEL -->
<div class="card">
<h2>🌐 DARK TUNNEL</h2>
<h3>₹3</h3>
<button onclick="startProcess('vpn')">Buy Now</button>
</div>

<!-- HTTP INJECTOR -->
<div class="card">
<h2>📡 HTTP INJECTOR</h2>
<h3>₹3</h3>
<button onclick="startProcess('http')">Buy Now</button>
</div>

<!-- NETMOD -->
<div class="card">
<h2>⚡ NETMOD FILE</h2>
<h3>₹3</h3>
<button onclick="startProcess('netmod')">Buy Now</button>
</div>

</div>

<!-- LOADER -->
<div id="loader">⚡ Connecting to Secure Server...</div>

<!-- CHATBOT -->
<div id="chatbot">
<div id="chatlog"></div>
<input placeholder="Ask something..." onkeypress="chat(event)">
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

<script>

/* MAIN SYSTEM */
function startProcess(type){

// save file type
localStorage.setItem("fileType", type);

// open payment
window.location.href="upi://pay?pa=pankajratrey7@axl&pn=PankajStore&am=3&cu=INR";

// fake loading
setTimeout(()=>{
document.getElementById("loader").style.display="block";

setTimeout(()=>{
goDownload();
},3000);

},2000);
}

/* DOWNLOAD REDIRECT */
function goDownload(){
let type = localStorage.getItem("fileType");

if(type==="vpn"){
window.location.href="vpn_config.dt.dark";
}

if(type==="http"){
window.location.href="http_injector.ehi.ehi";
}

if(type==="netmod"){
window.location.href="netmod_config.nm"; // if you add later
}
}

/* CHATBOT */
function chat(e){
if(e.key==="Enter"){
let input=e.target.value.toLowerCase();
let log=document.getElementById("chatlog");

log.innerHTML+="<div>👤 "+input+"</div>";

let reply="🤖 Buy file to continue";

if(input.includes("price")) reply="💰 All files are ₹3 only";
if(input.includes("vpn")) reply="🌐 Dark Tunnel available";
if(input.includes("http")) reply="📡 HTTP Injector available";
if(input.includes("help")) reply="📧 Contact: cgpolishkorba@gmail.com";

log.innerHTML+="<div>"+reply+"</div>";

e.target.value="";
}
}

/* PARTICLES */
particlesJS("particles-js",{
"particles":{
"number":{"value":60},
"size":{"value":3},
"move":{"speed":2},
"line_linked":{"enable":true}
}
});

</script>

</body>
</html>
