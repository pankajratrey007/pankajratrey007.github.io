<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Pro Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:#00ffcc;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #00ffcc22, transparent 40%),
radial-gradient(circle at 80% 80%, #0066ff22, transparent 40%);
z-index:-1;
animation:move 6s infinite alternate;
}

@keyframes move{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(60deg);}
}

/* HEADER */
header{
text-align:center;
padding:25px;
font-size:28px;
border-bottom:1px solid #00ffcc33;
}

/* CARD */
.card{
width:90%;
max-width:420px;
margin:20px auto;
padding:20px;
border:1px solid #00ffcc33;
border-radius:15px;
background:rgba(0,0,0,0.6);
text-align:center;
backdrop-filter:blur(10px);
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00ffcc,#0066ff);
color:white;
cursor:pointer;
}

input, textarea{
width:90%;
padding:10px;
margin:5px;
border-radius:10px;
border:none;
}

/* HIDE */
.hidden{display:none;}

.star{
font-size:25px;
cursor:pointer;
color:#555;
}
.star.active{color:#00ffcc;}

</style>
</head>

<body>

<header>
⚡ VPN PRO STORE ⚡
</header>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>🔐 Login</h2>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<!-- STORE -->
<div class="card hidden" id="store">

<h2>🔥 Premium VPN</h2>

<button onclick="buy()">BUY NOW</button>

<p id="status"></p>

<div id="download" class="hidden">
<a id="fileLink" href="#" download>
<button>Download</button>
</a>
</div>

</div>

<!-- REVIEWS -->
<div class="card hidden" id="reviewBox">

<h3>⭐ Reviews</h3>

<div id="stars">
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<textarea id="msg" placeholder="Write review"></textarea>
<button onclick="post()">Post</button>

<div id="list"></div>

</div>

<!-- ADMIN -->
<div class="card hidden" id="adminBox">
<h3>🧑‍💻 Admin Panel</h3>
<input id="file" placeholder="File URL">
<button onclick="addFile()">Add File</button>
</div>

<script>

/* LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="admin" && p==="1234"){
document.getElementById("adminBox").classList.remove("hidden");
}

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("store").classList.remove("hidden");
document.getElementById("reviewBox").classList.remove("hidden");
}

/* FILES */
let files=[];

/* BUY */
function buy(){

document.getElementById("status").innerText="Processing...";

setTimeout(()=>{

let f=files[Math.floor(Math.random()*files.length)];
if(!f) f="files/demo.zip";

document.getElementById("fileLink").href=f;
document.getElementById("download").classList.remove("hidden");

document.getElementById("status").innerText="Ready ✔";

},2000);

}

/* ADMIN ADD FILE */
function addFile(){
let f=document.getElementById("file").value;
files.push(f);
alert("File Added");
}

/* RATING */
function rate(n){
let s=document.querySelectorAll(".star");
s.forEach((x,i)=>{
x.classList.toggle("active",i<n);
});
}

/* REVIEWS */
function post(){
let msg=document.getElementById("msg").value;
let div=document.createElement("div");
div.innerHTML="💬 "+msg;
document.getElementById("list").prepend(div);
document.getElementById("msg").value="";
}

</script>

</body>
</html>
