<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pankaj AI Ultra</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

/* 🌌 BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#111,#000);
  animation:bg 12s infinite alternate;
}
@keyframes bg{
  from{transform:translate(0,0)}
  to{transform:translate(-120px,-120px)}
}

/* UI */
.container{padding:15px; position:relative; z-index:2;}

.chat{
  height:320px;
  overflow:auto;
  background:#111;
  border-radius:12px;
  padding:10px;
  font-size:14px;
}

button{
  padding:12px;
  margin:4px;
  border:none;
  border-radius:12px;
  background:#222;
  color:white;
  font-size:14px;
}

button:hover{background:#444;}

input{
  padding:10px;
  width:60%;
  border:none;
  border-radius:10px;
}

/* 👁️ EYE */
.eye{
  position:absolute;
  width:60px;
  top:18%;
  left:42%;
  animation:blink 3s infinite;
}
@keyframes blink{
  0%,90%,100%{opacity:1}
  95%{opacity:0}
}

/* 💀 GLITCH */
.glitch{animation:glitch 0.15s infinite;}
@keyframes glitch{
  0%{transform:translate(2px)}
  50%{transform:translate(-2px)}
}

img{max-width:100%; border-radius:10px;}
</style>
</head>

<body>

<img src="https://i.ibb.co/4f7Yz0Y/eye.png" class="eye">

<div class="container">

<h2>Developed by Pankaj Ratrey</h2>

<div id="chat" class="chat"></div>

<input id="msg" placeholder="Type message...">
<button onclick="send()">Send</button>
<button onclick="voice()">🎤</button>

<br>

<button onclick="img()">🎨 Image</button>
<button onclick="theme()">🌙 Theme</button>
<button onclick="horror()">💀 Horror</button>
<button onclick="mode()">🧠 Mode</button>

<div id="image"></div>

</div>

<script>

const chat = document.getElementById("chat");
let aiMode = "normal";

/* 💬 ADD */
function add(t){
  chat.innerHTML += "<p>"+t+"</p>";
  chat.scrollTop = chat.scrollHeight;
}

/* 🧠 HUMAN STYLE RESPONSES */
const greetings = [
 "Hey 👋","Hi 😊","Hello there!","Hii bro 😄","Hey what's up!"
];

const howareyou = [
 "I'm good! How about you?",
 "Doing great 😎 what about you?",
 "All good here 👍 you?",
 "Feeling awesome today 🔥"
];

const casual = [
 "Nice 👍",
 "That's cool 😄",
 "Ohhh interesting 🤔",
 "Tell me more 👀",
 "Haha 😂 that's funny",
 "I like that 😎"
];

const motivation = [
 "🔥 You can do anything!",
 "Never give up 💪",
 "You're strong bro!",
 "Keep pushing forward 🚀"
];

const horrorText = [
 "👁️ I can see you...",
 "Don't turn around...",
 "Something is behind you...",
 "You are not alone..."
];

/* 🧠 AI ENGINE */
function ai(text){

 text = text.toLowerCase();

 if(aiMode=="horror"){
   return random(horrorText);
 }

 if(aiMode=="motivation"){
   return random(motivation);
 }

 if(text.includes("hi")||text.includes("hello"))
   return random(greetings);

 if(text.includes("how are you"))
   return random(howareyou);

 if(text.includes("good")||text.includes("nice"))
   return random(casual);

 if(text.includes("sad"))
   return "I'm here for you ❤️";

 if(text.includes("love"))
   return "Love makes everything better ❤️";

 return random(casual);
}

/* 🎲 RANDOM */
function random(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

/* 💬 SEND */
function send(){
 let m = msg.value;
 add("You: "+m);

 add("AI: typing...");
 setTimeout(()=>{
   let r = ai(m);
   chat.lastChild.innerHTML = "AI: "+r;
   speak(r);
 },800);

 msg.value="";
}

/* 🎤 VOICE */
function voice(){
 let r = new webkitSpeechRecognition();
 r.onresult = e=>{
   msg.value = e.results[0][0].transcript;
 };
 r.start();
}

/* 🔊 SPEAK */
function speak(t){
 speechSynthesis.speak(new SpeechSynthesisUtterance(t));
}

/* 🎨 IMAGE */
function img(){
 let p = prompt("Enter image idea");
 image.innerHTML =
 `<img src="https://source.unsplash.com/400x300/?${p},anime">`;
}

/* 🌙 THEME */
function theme(){
 document.body.style.background =
 document.body.style.background=="white"?"black":"white";
}

/* 💀 HORROR */
function horror(){
 document.body.classList.toggle("glitch");
 add("⚠️ Something changed...");
}

/* 🧠 MODE */
function mode(){
 if(aiMode=="normal") aiMode="motivation";
 else if(aiMode=="motivation") aiMode="horror";
 else aiMode="normal";

 add("Mode: "+aiMode);
}

/* 💾 MEMORY */
onload=()=>{ if(localStorage.chat) chat.innerHTML=localStorage.chat; }
onbeforeunload=()=>{ localStorage.chat=chat.innerHTML; }

/* 🎬 INTRO */
setTimeout(()=> add("👋 Welcome back bro!"),1000);

/* 💀 RANDOM EVENT */
setInterval(()=>{
 if(Math.random()<0.08){
   add("👁️ ...");
 }
},10000);

</script>

</body>
</html>
