<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankaj Ultra Panel</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:#00ffff;
overflow:hidden;
}

/* FULL SCREEN PANEL */
.container{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* CARD */
.panel{
width:80%;
max-width:900px;
padding:30px;
border-radius:20px;
background:rgba(0,0,0,0.7);
backdrop-filter:blur(20px);
box-shadow:0 0 40px cyan;
text-align:center;
}

/* BUTTON */
.btn{
padding:12px 20px;
margin:10px;
border:1px solid cyan;
background:transparent;
color:cyan;
border-radius:10px;
transition:0.3s;
}

.btn:hover{
background:cyan;
color:black;
box-shadow:0 0 20px cyan;
transform:scale(1.1);
}

/* SELECT */
select{
padding:10px;
margin:10px;
border-radius:8px;
}

/* SKULL */
.skull{
position:absolute;
top:20%;
left:50%;
transform:translateX(-50%);
font-size:60px;
animation:float 4s infinite;
}
@keyframes float{
0%{transform:translateX(-50%) translateY(0);}
50%{transform:translateX(-50%) translateY(-20px);}
100%{transform:translateX(-50%) translateY(0);}
}

/* BG CANVAS */
#bg{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* LOGIN */
#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
padding:20px;
border-radius:15px;
box-shadow:0 0 20px cyan;
}

input{
padding:10px;
margin:10px;
border-radius:8px;
border:none;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="skull">💀</div>

<!-- LOGIN -->
<div id="login">
<h3>Login</h3>
<input id="user" placeholder="Username"><br>
<input id="pass" type="password" placeholder="Password"><br>
<button class="btn" onclick="login()">Enter</button>
</div>

<!-- MAIN PANEL -->
<div class="container" id="main" style="display:none;">
<div class="panel">

<h2>💀 Network Config Panel</h2>

<select id="sim">
<option>Jio</option>
<option>Airtel</option>
<option>Vi</option>
<option>BSNL</option>
</select>

<select id="net">
<option>4G</option>
<option>5G</option>
</select>

<br>

<button class="btn" onclick="download('dt')">⬇ Download Dark Tunnel</button>
<button class="btn" onclick="download('http')">⬇ Download HTTP Injector</button>

<p id="status"></p>

</div>
</div>

<script>

/* 🌌 BACKGROUND */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let stars=[];
for(let i=0;i<100;i++){
stars.push({x:Math.random()*c.width,y:Math.random()*c.height});
}

function anim(){
ctx.clearRect(0,0,c.width,c.height);
ctx.fillStyle="white";

stars.forEach(s=>{
ctx.fillRect(s.x,s.y,2,2);
s.y+=0.3;
if(s.y>c.height)s.y=0;
});

requestAnimationFrame(anim);
}
anim();

/* 🔐 LOGIN */
function login(){
let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u==="pankaj" && p==="9301101554"){
document.getElementById("login").style.display="none";
document.getElementById("main").style.display="flex";
}else{
alert("Wrong login");
}
}

/* 📥 DOWNLOAD SYSTEM */
function download(type){

let sim=document.getElementById("sim").value;
let net=document.getElementById("net").value;

document.getElementById("status").innerHTML=
"⚡ Preparing "+sim+" "+net+" Config...";

setTimeout(()=>{

if(type==="dt"){
window.location.href="vpn_config.dt.dark";
}
if(type==="http"){
window.location.href="http_injector.ehi.ehi";
}

},1500);

}

</script>

</body>
</html>
