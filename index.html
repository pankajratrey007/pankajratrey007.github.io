<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber VPN Store</title>

<style>
body{
margin:0;
font-family:monospace;
background:black;
color:#00ffcc;
overflow-x:hidden;
}

/* 🔥 BACKGROUND ANIMATION */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
radial-gradient(circle at 80% 30%, #0066ff33, transparent 40%),
radial-gradient(circle at 50% 80%, #ff00ff22, transparent 50%);
filter:blur(30px);
animation:move 8s infinite alternate;
z-index:-1;
}

@keyframes move{
0%{transform:scale(1);}
100%{transform:scale(1.3);}
}

.card{
width:90%;
max-width:420px;
margin:20px auto;
padding:20px;
border-radius:20px;
background:rgba(0,0,0,0.6);
border:1px solid #00ffcc55;
text-align:center;
box-shadow:0 0 25px #00ffcc44;
}

/* BUTTON */
button{
padding:12px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00ffcc,#0066ff);
color:white;
cursor:pointer;
margin:5px;
}

/* TERMINAL */
#terminal{
display:none;
background:black;
color:#00ffcc;
padding:10px;
height:200px;
overflow:auto;
font-size:12px;
text-align:left;
border-radius:10px;
}

/* SECRET */
#secret{display:none;}

.star{cursor:pointer;color:#555;}
.star.active{color:#00ffcc;}

</style>
</head>

<body>

<div class="card">
<h2>🔥 VPN CYBER STORE</h2>
<h3>₹3 Premium VPN</h3>

<button onclick="buy()">BUY</button>
<button onclick="paid()">I PAID</button>

<p id="status"></p>

<div id="terminal"></div>

<div id="download">
<a href="#" download><button>DOWNLOAD</button></a>
</div>

<p id="views"></p>
<p id="downloads"></p>

<button onclick="toggleSecret()">⚡ Secret</button>
</div>

<!-- SECRET PANEL -->
<div class="card" id="secret">

<h3>⭐ Reviews</h3>

<div>
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<input id="name" placeholder="Name">
<textarea id="msg" placeholder="Review"></textarea>
<input type="file" id="img">

<button onclick="post()">Post</button>

<div id="list"></div>

<hr>

<h3>🤖 AI Chat</h3>
<div id="chatBox" style="height:150px;overflow:auto;background:#000;"></div>
<input id="aiInput">
<button onclick="askAI()">Send</button>

</div>

<script>

/* 📊 TRACKING */
let v=localStorage.getItem("views")||0;
v++; localStorage.setItem("views",v);
views.innerText="👁️ "+v;

let dCount=localStorage.getItem("downloads")||0;
downloads.innerText="⬇ "+dCount;

/* FILES */
const files=["files/a.zip","files/b.zip","files/c.zip"];

/* BUY */
function buy(){
let upi="upi://pay?pa=pankajratrey7@axl&pn=Pankaj&am=3&cu=INR";
let a=document.createElement("a");
a.href=upi;
a.click();
status.innerText="Pay and click I PAID";
}

/* HACKER LOADING */
function paid(){

terminal.style.display="block";

let lines=[
"Initializing secure protocol...",
"Connecting to dark server...",
"Injecting payment token...",
"Bypassing firewall...",
"Decrypting payment...",
"Authorizing access...",
"Finalizing..."
];

let i=0;

let interval=setInterval(()=>{
terminal.innerHTML+="<p>> "+lines[i]+"</p>";
terminal.scrollTop=terminal.scrollHeight;
i++;
if(i>=lines.length)clearInterval(interval);
},8000);

setTimeout(()=>{
let file=files[Math.floor(Math.random()*files.length)];
download.style.display="block";
document.querySelector("#download a").href=file;
status.innerText="✔ VERIFIED";

dCount++;
localStorage.setItem("downloads",dCount);
downloads.innerText="⬇ "+dCount;

},60000);
}

/* SECRET */
function toggleSecret(){
secret.style.display = secret.style.display=="block"?"none":"block";
}

/* ⭐ */
let rating=0;
function rate(n){
rating=n;
document.querySelectorAll(".star").forEach((s,i)=>{
s.classList.toggle("active",i<n);
});
}

/* SAVE LOAD */
window.onload=function(){
let r=localStorage.getItem("reviews");
if(r) list.innerHTML=r;
}

/* REVIEW */
function post(){
let n=name.value;
let m=msg.value;
let imgFile=img.files[0];

if(!n||!m)return;

let div=document.createElement("div");

if(imgFile){
let reader=new FileReader();
reader.onload=function(e){
div.innerHTML=`<b>${n}</b> (${rating}⭐)<br>${m}<br><img src="${e.target.result}" width="80"><hr>`;
list.prepend(div);
localStorage.setItem("reviews",list.innerHTML);
};
reader.readAsDataURL(imgFile);
}else{
div.innerHTML=`<b>${n}</b> (${rating}⭐): ${m}`;
list.prepend(div);
localStorage.setItem("reviews",list.innerHTML);
}
}

/* 🤖 AI HUMAN STYLE */
function askAI(){

let q=aiInput.value.toLowerCase();
chatBox.innerHTML+="<p><b>You:</b> "+q+"</p>";

let reply="Hmm samajh nahi aaya bro 🤔";

if(q.includes("hi")||q.includes("hello"))
reply="Hey bro 👋 kya help chahiye?";
else if(q.includes("price"))
reply="Bhai sirf ₹3 hai, cheap and best 😎";
else if(q.includes("vpn"))
reply="Ye VPN fast hai gaming ke liye 🔥";
else if(q.includes("problem"))
reply="Agar issue hai toh review section me bata bro 👍";
else if(q.includes("download"))
reply="Payment ke baad I PAID dabao, auto unlock ho jayega 💻";

chatBox.innerHTML+="<p><b>AI:</b> "+reply+"</p>";

aiInput.value="";
chatBox.scrollTop=chatBox.scrollHeight;
}

</script>

</body>
</html>
