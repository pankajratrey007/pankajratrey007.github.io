<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankaj Hacker Store</title>

<style>
body{
margin:0;
background:black;
font-family:monospace;
color:#00ffff;
overflow:hidden;
}

/* GLASS PANEL */
.panel{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,255,255,0.08);
backdrop-filter:blur(10px);
padding:20px;
border-radius:15px;
box-shadow:0 0 30px cyan;
width:90%;
max-width:350px;
text-align:center;
}

/* INPUT */
input{
width:90%;
padding:10px;
margin:10px;
border:none;
border-radius:8px;
background:#111;
color:cyan;
}

/* BUTTON */
.btn{
padding:10px 15px;
border:1px solid cyan;
background:transparent;
color:cyan;
border-radius:10px;
margin:10px;
}

/* STORE */
.card{
background:rgba(0,0,0,0.8);
padding:10px;
margin:10px;
border-radius:10px;
box-shadow:0 0 10px cyan;
}

img{
width:100%;
border-radius:10px;
}

#store{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
overflow:auto;
padding-top:60px;
}

/* TOP BAR */
#top{
position:fixed;
top:0;
width:100%;
background:rgba(0,255,255,0.1);
text-align:center;
padding:10px;
}

/* TYPE TEXT */
#typing{
margin-top:50px;
text-align:center;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="panel">
<h3>🔐 LOGIN</h3>
<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">ENTER</button>
</div>

<!-- STORE -->
<div id="store">
<div id="top">💀 HACKER STORE</div>

<div id="typing">Welcome...</div>

<div class="card">
<img src="https://picsum.photos/300/150?1">
<h4>Dark Tunnel Config</h4>
<button class="btn" onclick="selectFile('dark')">Select</button>
</div>

<div class="card">
<img src="https://picsum.photos/300/150?2">
<h4>HTTP Injector Config</h4>
<button class="btn" onclick="selectFile('http')">Select</button>
</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* LOGIN */
function login(){
if(user.value==="pankaj" && pass.value==="9301101554"){
login.style.display="none";
store.style.display="block";
type("Access Granted. Welcome.");
}else{
alert("Wrong");
}
}

/* TYPE */
function type(text){
let i=0;
typing.innerText="";
let t=setInterval(()=>{
typing.innerText+=text[i];
i++;
if(i>=text.length) clearInterval(t);
},40);
}

/* SELECT FILE */
function selectFile(type){
type("Choose Network");

store.innerHTML=`
<div id="top">Select Network</div>

<div class="panel">
<button class="btn" onclick="net('${type}','Jio')">Jio</button>
<button class="btn" onclick="net('${type}','Airtel')">Airtel</button>
<button class="btn" onclick="net('${type}','Vi')">Vi</button>
<button class="btn" onclick="net('${type}','BSNL')">BSNL</button>
</div>
`;
}

/* NETWORK */
function net(file,sim){
store.innerHTML=`
<div id="top">${sim} Network</div>

<div class="panel">
<button class="btn" onclick="download('${file}','${sim}','4G')">4G</button>
<button class="btn" onclick="download('${file}','${sim}','5G')">5G</button>
</div>
`;
}

/* DOWNLOAD */
function download(file,sim,net){
alert("Downloading "+file+" "+sim+" "+net);
}

/* 3D BACKGROUND */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=5;

const renderer=new THREE.WebGLRenderer({alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* PARTICLES */
const geo=new THREE.BufferGeometry();
let v=[];
for(let i=0;i<1000;i++){
v.push((Math.random()-0.5)*30,(Math.random()-0.5)*30,(Math.random()-0.5)*30);
}
geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));

const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0x00ffff}));
scene.add(stars);

/* ANIMATION */
function animate(){
requestAnimationFrame(animate);
stars.rotation.y+=0.001;
renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
