<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankaj GOD MODE</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:monospace;
color:#00ffff;
background:black;
}

/* 🤖 HUD */
#hud{
position:absolute;
top:10px;
left:10px;
font-size:12px;
opacity:0.8;
}

#jarvis{
position:absolute;
bottom:20px;
left:20px;
font-size:14px;
text-shadow:0 0 10px cyan;
}

/* 💠 PANEL */
#panel{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,255,255,0.08);
backdrop-filter:blur(15px);
padding:25px;
border-radius:15px;
box-shadow:0 0 30px cyan;
display:none;
}

/* BUTTON */
.btn{
margin:10px;
padding:10px 15px;
border:1px solid cyan;
background:transparent;
color:cyan;
border-radius:10px;
}

/* LOGIN */
#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px cyan;
}

input{
padding:10px;
margin:10px;
border:none;
border-radius:5px;
}

video{
display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<h3>Login</h3>
<input id="user"><br>
<input id="pass" type="password"><br>
<button class="btn" onclick="login()">Enter</button>
</div>

<!-- HUD -->
<div id="hud">
💀 SYSTEM ONLINE<br>
📡 NETWORK: READY<br>
⚡ STATUS: ACTIVE
</div>

<!-- PANEL -->
<div id="panel">
<h2>Control</h2>

<select id="sim">
<option>Jio</option>
<option>Airtel</option>
<option>Vi</option>
<option>BSNL</option>
</select>

<select id="net">
<option>4G</option>
<option>5G</option>
</select>

<br>

<button class="btn" onclick="download()">Download</button>
<button class="btn" onclick="closePanel()">Close</button>
</div>

<div id="jarvis">Initializing...</div>

<video id="cam" autoplay></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* 🔐 LOGIN */
function login(){
if(user.value==="pankaj" && pass.value==="9301101554"){
login.style.display="none";
jarvis("Welcome Pankaj");
startVoice();
startCamera();
}else{
alert("Wrong");
}
}

/* 🤖 JARVIS VOICE */
function jarvis(text){
let msg=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(msg);

let el=document.getElementById("jarvis");
el.innerHTML=text;
}

/* 🎤 VOICE COMMAND */
function startVoice(){
let rec=new(window.SpeechRecognition||webkitSpeechRecognition)();
rec.continuous=true;

rec.onresult=(e)=>{
let cmd=e.results[e.results.length-1][0].transcript.toLowerCase();

if(cmd.includes("open panel")){
openPanel();
jarvis("Opening panel");
}

if(cmd.includes("close")){
closePanel();
}

};

rec.start();
}

/* ✋ CAMERA (gesture base) */
function startCamera(){
navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
cam.srcObject=stream;
});
}

/* PANEL */
function openPanel(){
panel.style.display="block";
}
function closePanel(){
panel.style.display="none";
}

/* DOWNLOAD */
function download(){
let sim=document.getElementById("sim").value;
let net=document.getElementById("net").value;

jarvis("Downloading "+sim+" "+net);
}

/* 🌌 THREE.JS */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=5;

const renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* STARS */
const geo=new THREE.BufferGeometry();
let v=[];
for(let i=0;i<2000;i++){
v.push((Math.random()-0.5)*50,(Math.random()-0.5)*50,(Math.random()-0.5)*50);
}
geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));

const mat=new THREE.PointsMaterial({color:0x00ffff});
const stars=new THREE.Points(geo,mat);
scene.add(stars);

/* CUBE */
const cube=new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshBasicMaterial({color:0x00ffff,wireframe:true})
);
scene.add(cube);

/* CLICK */
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.onclick=(e)=>{
mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;

ray.setFromCamera(mouse,camera);
if(ray.intersectObject(cube).length>0){
openPanel();
jarvis("Panel opened");
}
};

/* ANIMATE */
function animate(){
requestAnimationFrame(animate);
cube.rotation.x+=0.01;
cube.rotation.y+=0.01;
stars.rotation.y+=0.0005;
renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
