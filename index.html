<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Cyber Luxury Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:#00ffcc;
overflow-x:hidden;
}

/* BACKGROUND */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
radial-gradient(circle at 80% 30%, #0066ff33, transparent 40%),
radial-gradient(circle at 50% 80%, #ff00ff22, transparent 50%);
filter:blur(25px);
animation:move 6s infinite alternate;
z-index:-1;
}

@keyframes move{
0%{transform:scale(1);}
100%{transform:scale(1.2);}
}

/* CARD */
.card{
width:90%;
max-width:420px;
margin:20px auto;
padding:20px;
border-radius:20px;
background:rgba(0,0,0,0.6);
border:1px solid #00ffcc33;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 25px #00ffcc22;
}

/* INPUT */
input, textarea{
width:90%;
padding:10px;
margin:8px;
border-radius:10px;
border:none;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00ffcc,#0066ff);
color:white;
cursor:pointer;
box-shadow:0 10px 20px #00ffcc33;
}

/* STAR */
.star{font-size:22px;cursor:pointer;color:#555;}
.star.active{color:#00ffcc;}

#download{display:none;margin-top:10px;}
</style>
</head>

<body>

<div class="card">
<h2>🔥 VPN CYBER STORE</h2>
<h3>₹3 Premium VPN Pack</h3>

<button onclick="buy()">BUY NOW</button>
<button onclick="paid()">I HAVE PAID</button>

<p id="status"></p>

<div id="download">
<a href="#" download><button>DOWNLOAD FILE</button></a>
</div>

<hr>

<h3>📊 Stats</h3>
<p id="views"></p>
<p id="downloads"></p>

</div>

<div class="card">
<h3>⭐ Reviews</h3>

<div>
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<input id="name" placeholder="Name">
<textarea id="reviewMsg" placeholder="Write review..."></textarea>
<input type="file" id="img">

<button onclick="post()">Post</button>

<div id="list"></div>
</div>

<div class="card">
<h3>🤖 AI Assistant</h3>

<div id="chatBox" style="height:200px;overflow:auto;background:#000;padding:10px;border-radius:10px;"></div>

<input id="aiInput" placeholder="Ask something...">
<button onclick="askAI()">Send</button>
</div>

<script>

/* 📊 TRACKING */
let views = localStorage.getItem("views") || 0;
views++;
localStorage.setItem("views", views);

document.getElementById("views").innerText = "👁️ Visitors: " + views;

let downloads = localStorage.getItem("downloads") || 0;
document.getElementById("downloads").innerText = "⬇ Downloads: " + downloads;

/* FILES */
const files=[
"files/darktunnel.zip",
"files/httpcustom.zip",
"files/injector.zip",
"files/netmod.zip"
];

/* BUY */
function buy(){
let upi="upi://pay?pa=pankajratrey7@axl&pn=Pankaj&am=3&cu=INR";
let a=document.createElement("a");
a.href=upi;
a.click();

status.innerText="➡ Pay and click 'I HAVE PAID'";
}

/* VERIFY */
function paid(){

status.innerText="🟢 Connecting...";

let steps=[
"🔍 Verifying...",
"💻 Secure check...",
"🛡 Bypass...",
"📡 Sync...",
"🔐 Unlocking..."
];

let i=0;
let interval=setInterval(()=>{
status.innerText=steps[i];
i++;
if(i>=steps.length)clearInterval(interval);
},10000);

setTimeout(()=>{
let file=files[Math.floor(Math.random()*files.length)];
status.innerText="✔ Verified";

download.style.display="block";
document.querySelector("#download a").href=file;

/* TRACK DOWNLOAD */
downloads++;
localStorage.setItem("downloads", downloads);
document.getElementById("downloads").innerText="⬇ Downloads: "+downloads;

},60000);
}

/* ⭐ RATING */
let rating=0;
function rate(n){
rating=n;
document.querySelectorAll(".star").forEach((s,i)=>{
s.classList.toggle("active",i<n);
});
}

/* LOAD REVIEWS */
window.onload=function(){
let saved=localStorage.getItem("reviews");
if(saved) list.innerHTML=saved;
}

/* SAVE */
function saveReviews(){
localStorage.setItem("reviews", list.innerHTML);
}

/* REVIEW */
function post(){
let n=name.value;
let m=reviewMsg.value;
let img=document.getElementById("img").files[0];

if(!n||!m)return;

let d=document.createElement("div");

if(img){
let reader=new FileReader();
reader.onload=function(e){
d.innerHTML=`
💬 <b>${n}</b> (${rating}⭐)<br>
${m}<br>
<img src="${e.target.result}" width="100"><hr>`;
list.prepend(d);
saveReviews();
};
reader.readAsDataURL(img);
}else{
d.innerHTML="💬 <b>"+n+"</b> ("+rating+"⭐): "+m;
list.prepend(d);
saveReviews();
}

name.value="";
reviewMsg.value="";
img.value="";
}

/* 🤖 AI BOT */
function askAI(){

let input=aiInput.value.toLowerCase();
chatBox.innerHTML += "<p><b>You:</b> "+input+"</p>";

let reply="🤖 Not sure.";

if(input.includes("vpn")) reply="🔥 Fast VPN for gaming.";
else if(input.includes("price")) reply="💰 Only ₹3.";
else if(input.includes("download")) reply="⬇ Click I PAID after payment.";
else if(input.includes("hi")) reply="👋 Hello bro!";
else if(input.includes("issue")) reply="🆘 Use review section.";

chatBox.innerHTML += "<p><b>AI:</b> "+reply+"</p>";

aiInput.value="";
chatBox.scrollTop=chatBox.scrollHeight;
}

</script>

</body>
</html>
