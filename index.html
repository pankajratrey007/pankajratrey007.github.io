<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pankaj Iron HUD</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:monospace;
color:#00ffff;
background:black;
}

/* UI LAYER */
#ui{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
z-index:10;
pointer-events:none;
}

/* HUD CORNERS */
.hud-box{
position:absolute;
width:60px;
height:60px;
border:2px solid cyan;
}

#tl{top:10px;left:10px;border-right:none;border-bottom:none;}
#tr{top:10px;right:10px;border-left:none;border-bottom:none;}
#bl{bottom:10px;left:10px;border-right:none;border-top:none;}
#br{bottom:10px;right:10px;border-left:none;border-top:none;}

/* RADAR */
#radar{
position:absolute;
top:20px;
right:20px;
width:100px;
height:100px;
border:2px solid cyan;
border-radius:50%;
overflow:hidden;
}

#scan{
width:100%;
height:100%;
border-radius:50%;
border-top:2px solid cyan;
animation:rotate 2s linear infinite;
}

@keyframes rotate{
100%{transform:rotate(360deg);}
}

/* SCAN LINE */
#line{
position:absolute;
top:0;
left:0;
width:100%;
height:2px;
background:cyan;
animation:scan 3s linear infinite;
}

@keyframes scan{
0%{top:0;}
100%{top:100%;}
}

/* LOGIN */
#login{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:black;
padding:20px;
border-radius:10px;
box-shadow:0 0 20px cyan;
pointer-events:auto;
}

/* PANEL */
#panel{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:rgba(0,255,255,0.08);
padding:25px;
border-radius:15px;
box-shadow:0 0 30px cyan;
display:none;
pointer-events:auto;
}

/* BUTTON */
.btn{
margin:10px;
padding:10px 15px;
border:1px solid cyan;
background:transparent;
color:cyan;
border-radius:10px;
}

input{
padding:10px;
margin:10px;
border-radius:5px;
border:none;
}

/* TEXT */
#jarvis{
position:absolute;
bottom:20px;
left:20px;
}

</style>
</head>

<body>

<div id="ui">

<div id="tl" class="hud-box"></div>
<div id="tr" class="hud-box"></div>
<div id="bl" class="hud-box"></div>
<div id="br" class="hud-box"></div>

<div id="radar"><div id="scan"></div></div>
<div id="line"></div>

<!-- LOGIN -->
<div id="login">
<input id="user" placeholder="Username"><br>
<input id="pass" type="password"><br>
<button class="btn" onclick="login()">Enter</button>
</div>

<!-- PANEL -->
<div id="panel">
<h2>Control</h2>

<select id="sim">
<option>Jio</option>
<option>Airtel</option>
<option>Vi</option>
<option>BSNL</option>
</select>

<select id="net">
<option>4G</option>
<option>5G</option>
</select>

<br>

<button class="btn" onclick="download()">Download</button>
<button class="btn" onclick="closePanel()">Close</button>
</div>

<div id="jarvis">System Ready...</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* LOGIN */
function login(){
if(user.value==="pankaj" && pass.value==="9301101554"){
login.style.display="none";

/* VOICE */
speechSynthesis.speak(new SpeechSynthesisUtterance("Welcome Pankaj"));

jarvis.innerText="Welcome Pankaj";
}else{
alert("Wrong");
}
}

/* PANEL */
function openPanel(){
panel.style.display="block";
}
function closePanel(){
panel.style.display="none";
}

/* TOUCH SWIPE */
let startY=0;

window.addEventListener("touchstart",(e)=>{
startY=e.touches[0].clientY;
});

window.addEventListener("touchend",(e)=>{
let endY=e.changedTouches[0].clientY;

if(startY-endY>50){
openPanel(); // swipe up
}
if(endY-startY>50){
closePanel(); // swipe down
}
});

/* DOWNLOAD */
function download(){
let sim=document.getElementById("sim").value;
let net=document.getElementById("net").value;
jarvis.innerText="Downloading "+sim+" "+net;
}

/* THREE.JS */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
camera.position.z=5;

const renderer=new THREE.WebGLRenderer();
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

/* PARTICLES */
const geo=new THREE.BufferGeometry();
let v=[];
for(let i=0;i<1500;i++){
v.push((Math.random()-0.5)*50,(Math.random()-0.5)*50,(Math.random()-0.5)*50);
}
geo.setAttribute('position',new THREE.Float32BufferAttribute(v,3));

const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:0x00ffff}));
scene.add(stars);

/* CUBE */
const cube=new THREE.Mesh(
new THREE.BoxGeometry(),
new THREE.MeshBasicMaterial({color:0x00ffff,wireframe:true})
);
scene.add(cube);

/* CLICK */
const ray=new THREE.Raycaster();
const mouse=new THREE.Vector2();

window.onclick=(e)=>{
mouse.x=(e.clientX/innerWidth)*2-1;
mouse.y=-(e.clientY/innerHeight)*2+1;

ray.setFromCamera(mouse,camera);

if(ray.intersectObject(cube).length>0){
openPanel();
}
};

/* ANIMATE */
function animate(){
requestAnimationFrame(animate);
cube.rotation.x+=0.01;
cube.rotation.y+=0.01;
stars.rotation.y+=0.0005;
renderer.render(scene,camera);
}
animate();

</script>

</body>
</html>
