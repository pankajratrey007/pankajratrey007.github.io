<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Study Hub</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1120;
  color:white;
}

.nav{
  display:flex;
  justify-content:space-between;
  padding:15px;
  background:#020617;
}

.hero{
  height:70vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.btn{
  padding:12px 20px;
  background:#6366f1;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.section{
  padding:40px;
  text-align:center;
}

iframe{
  width:100%;
  height:500px;
  border:none;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="nav">
  <div>Study Hub</div>
</div>

<section class="hero">
  <h1>ITI Study Materials</h1>
  <button class="btn" onclick="go()">Open Materials</button>
</section>

<section class="section" id="drive">
  <h2>All Study Material (Live)</h2>

  <!-- REAL DRIVE EMBED -->
  <iframe src="https://drive.google.com/embeddedfolderview?id=0B8lxEfA7LFv6NWsyWXlvZjFxbU0#grid"></iframe>

</section>

<script>
function go(){
  document.getElementById("drive").scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
