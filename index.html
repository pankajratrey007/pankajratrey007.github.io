<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN Cyber Luxury Store</title>

<style>

body{
margin:0;
font-family:Arial;
background:black;
color:#00ffcc;
overflow-x:hidden;
}

/* 🔥 CYBER BACKGROUND */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, #00ffcc33, transparent 40%),
radial-gradient(circle at 80% 30%, #0066ff33, transparent 40%),
radial-gradient(circle at 50% 80%, #ff00ff22, transparent 50%);
filter:blur(25px);
animation:move 6s infinite alternate;
z-index:-1;
}

@keyframes move{
0%{transform:scale(1);}
100%{transform:scale(1.2);}
}

/* CARD */
.card{
width:90%;
max-width:420px;
margin:20px auto;
padding:20px;
border-radius:20px;
background:rgba(0,0,0,0.6);
border:1px solid #00ffcc33;
text-align:center;
backdrop-filter:blur(10px);
box-shadow:0 0 25px #00ffcc22;
transition:0.3s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 50px #00ffcc;
}

/* INPUT */
input, textarea{
width:90%;
padding:10px;
margin:8px;
border-radius:10px;
border:none;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:30px;
background:linear-gradient(45deg,#00ffcc,#0066ff);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
box-shadow:0 10px 20px #00ffcc33;
}

button:hover{
transform:scale(1.1);
box-shadow:0 0 40px #00ffcc;
}

/* BUY GLOW */
.buyGlow{
box-shadow:0 0 25px #00ffcc;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.08);}
100%{transform:scale(1);}
}

/* STAR */
.star{
font-size:22px;
cursor:pointer;
color:#555;
}
.star.active{
color:#00ffcc;
text-shadow:0 0 10px #00ffcc;
}

/* HIDE */
.hidden{display:none;}

#download{display:none;margin-top:10px;}

</style>
</head>

<body>

<!-- LOGIN -->
<div class="card" id="loginBox">
<h2>⚡ CYBER LOGIN ⚡</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>

<p id="msg"></p>
</div>

<!-- DASHBOARD -->
<div class="card hidden" id="dashboard">
<h2>✔ ACCESS GRANTED</h2>
<p id="welcome"></p>

<button onclick="openStore()">Enter Store</button>
<button onclick="logout()">Logout</button>
</div>

<!-- STORE -->
<div class="card hidden" id="store">

<h2>🔥 VPN CYBER STORE</h2>
<h3>₹3 Premium VPN Pack</h3>

<button class="buyGlow" onclick="buy()">BUY NOW</button>
<button onclick="paid()">I HAVE PAID</button>

<p id="status"></p>

<div id="download">
<a href="#" download>
<button>DOWNLOAD FILE</button>
</a>
</div>

</div>

<!-- REVIEWS -->
<div class="card hidden" id="reviewsBox">

<h3>⭐ Reviews</h3>

<div>
<span class="star" onclick="rate(1)">★</span>
<span class="star" onclick="rate(2)">★</span>
<span class="star" onclick="rate(3)">★</span>
<span class="star" onclick="rate(4)">★</span>
<span class="star" onclick="rate(5)">★</span>
</div>

<input id="name" placeholder="Name">
<textarea id="reviewMsg" placeholder="Write review..."></textarea>

<button onclick="post()">Post</button>

<div id="list"></div>

</div>

<script>

/* 🔐 SIGNUP */
function signup(){
let u=user.value;
let p=pass.value;

if(!u||!p){
msg.innerText="Fill all fields ❌";
return;
}

localStorage.setItem("user_"+u,p);
msg.innerText="Account Created ✔";
}

/* 🔐 LOGIN */
function login(){
let u=user.value;
let p=pass.value;

let saved=localStorage.getItem("user_"+u);

if(saved && saved===p){

localStorage.setItem("currentUser",u);

loginBox.classList.add("hidden");
dashboard.classList.remove("hidden");

welcome.innerText="Welcome "+u;

}else{
msg.innerText="Wrong Login ❌";
}
}

/* STORE */
function openStore(){
dashboard.classList.add("hidden");
store.classList.remove("hidden");
reviewsBox.classList.remove("hidden");
}

/* FILES */
const files=[
"files/darktunnel.zip",
"files/httpcustom.zip",
"files/injector.zip",
"files/netmod.zip"
];

/* BUY */
function buy(){

let upi="upi://pay?pa=pankajratrey7@axl&pn=Pankaj&am=3&cu=INR";

window.location.href=upi;

status.innerText="➡ Opened payment app. Pay and click 'I HAVE PAID'";
}

/* VERIFY */
function paid(){

status.innerText="⏳ Checking payment...";

setTimeout(()=>{

let file=files[Math.floor(Math.random()*files.length)];

status.innerText="✔ Payment Verified";

download.style.display="block";
document.querySelector("#download a").href=file;

},4000);

}

/* RATING */
function rate(n){
document.querySelectorAll(".star").forEach((s,i)=>{
s.classList.toggle("active",i<n);
});
}

/* REVIEWS */
function post(){
let n=name.value;
let m=reviewMsg.value;

if(!n||!m)return;

let d=document.createElement("div");
d.innerHTML="💬 <b>"+n+"</b>: "+m;

list.prepend(d);

name.value="";
reviewMsg.value="";
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}

</script>

</body>
</html>
